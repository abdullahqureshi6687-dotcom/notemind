[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notemind"
version = "0.1.0"
description = "Chat with your university notes: a from-scratch RAG pipeline with citations, quizzes and retrieval evaluation."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
